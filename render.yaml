services:
  - type: web
    name: smart-civic-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PROJECT_NAME
        value: "Smart Civic Platform API"
      - key: API_V1_STR
        value: "/api/v1"

  - type: static
    name: smart-civic-admin-portal
    rootDir: admin-portal
    buildCommand: npm install && npm run build
    staticPublishPath: out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://civicproject-ouo8.onrender.com
      - key: NODE_VERSION
        value: 20.18.0

